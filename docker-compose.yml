# ==============================================================================
# Docker Compose — Toko Buku Anelinda Books (Monorepo)
# Jalankan langsung setelah git clone:
#   Production mode : docker compose up -d --build
#   Development HMR : docker compose --profile dev up --build
#   Stop container  : docker compose down
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Frontend User (Public Storefront) — Production Build (Port 3000)
  # ----------------------------------------------------------------------------
  frontend_user:
    build:
      context: ./frontend_user
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
    image: anelinda/frontend-user:latest
    container_name: anelinda-frontend-user
    ports:
      - "${FRONTEND_USER_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      NODE_OPTIONS: "--max-old-space-size=96"
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - anelinda_net

  # ----------------------------------------------------------------------------
  # 2. Frontend Admin (Admin & Owner Dashboard) — Production Build (Port 3001)
  # ----------------------------------------------------------------------------
  frontend_admin:
    build:
      context: ./frontend_admin
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
    image: anelinda/frontend-admin:latest
    container_name: anelinda-frontend-admin
    ports:
      - "${FRONTEND_ADMIN_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3001"
      NODE_OPTIONS: "--max-old-space-size=64"
    mem_limit: 96m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - anelinda_net

  # ----------------------------------------------------------------------------
  # 3. [Opsional Profile: dev] Frontend User — Vite HMR Development (Port 3000)
  #    Jalankan: docker compose --profile dev up frontend_user_dev frontend_admin_dev
  # ----------------------------------------------------------------------------
  frontend_user_dev:
    profiles: ["dev"]
    build:
      context: ./frontend_user
      dockerfile: Dockerfile
      target: development
    image: anelinda/frontend-user:dev
    container_name: anelinda-frontend-user-dev
    ports:
      - "${FRONTEND_USER_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
    volumes:
      - ./frontend_user:/app
      - frontend_user_node_modules:/app/node_modules
    networks:
      - anelinda_net

  # ----------------------------------------------------------------------------
  # 4. [Opsional Profile: dev] Frontend Admin — Vite HMR Development (Port 3001)
  # ----------------------------------------------------------------------------
  frontend_admin_dev:
    profiles: ["dev"]
    build:
      context: ./frontend_admin
      dockerfile: Dockerfile
      target: development
    image: anelinda/frontend-admin:dev
    container_name: anelinda-frontend-admin-dev
    ports:
      - "${FRONTEND_ADMIN_PORT:-3001}:3001"
    environment:
      NODE_ENV: development
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
    volumes:
      - ./frontend_admin:/app
      - frontend_admin_node_modules:/app/node_modules
    networks:
      - anelinda_net

networks:
  anelinda_net:
    driver: bridge

volumes:
  frontend_user_node_modules:
  frontend_admin_node_modules:
